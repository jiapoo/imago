name: Imago
options:
  bundleIdPrefix: com.example.photobackup
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  ImagoKit:
    path: Packages/ImagoKit
  # Photo and video viewing and editing, shared with Arete at a version. Pinned here, since
  # Imago.xcodeproj (and its Package.resolved) isn't kept in git: raise it to take an update.
  # To change the package itself, see the README in github.com/jiapoo/arete-media.
  AreteMedia:
    url: https://github.com/jiapoo/arete-media
    exactVersion: 1.0.0
targets:
  ImagoMac:
    type: application
    scheme: {}
    platform: macOS
    sources: [Mac]
    dependencies:
      - package: ImagoKit
      - package: AreteMedia
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Imago
        LSApplicationCategoryType: public.app-category.photography
        NSLocalNetworkUsageDescription: Imago receives photos from your iPhone over your local network.
        NSBonjourServices: [_photobackup._tcp]
    entitlements:
      path: Mac/ImagoMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.server: true
        com.apple.security.network.client: true
        com.apple.security.assets.pictures.read-write: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.photobackup.mac
        PRODUCT_NAME: Imago
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
  ImagoiOS:
    type: application
    scheme: {}
    platform: iOS
    sources: [iOS]
    dependencies:
      - package: ImagoKit
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Imago
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: Imago copies your photos and videos to your Mac.
        NSCameraUsageDescription: The camera scans the pairing code shown on your Mac.
        NSLocalNetworkUsageDescription: Imago finds your Mac on your local network to send photos to it.
        NSBonjourServices: [_photobackup._tcp]
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: [com.example.photobackup.ios.processing, com.example.photobackup.ios.continued.*]
    # The iPhone's real name ("Jia's iPhone") needs Apple's user-assigned-device-name entitlement,
    # which you request from Apple for your team. Until it's approved, iOS reports "iPhone" and
    # the pairing screen asks for a name. Once approved, uncomment:
    # entitlements:
    #   path: iOS/ImagoiOS.entitlements
    #   properties:
    #     com.apple.developer.device-information.user-assigned-device-name: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.photobackup.ios
        PRODUCT_NAME: Imago
        TARGETED_DEVICE_FAMILY: "1"
